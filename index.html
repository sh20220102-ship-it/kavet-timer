<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kavet Timer</title>
<style>
:root{--bg:#e9e6e0;--fg:#1d1d20;--muted:#6d6b68;--btn:#fff;--btn-b:#d2cec6;--on:#1d1d20;--on-fg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151517;--fg:#f1f0ee;--muted:#9b9a98;--btn:#242427;--btn-b:#3a3a3e;--on:#f1f0ee;--on-fg:#151517;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151517;--fg:#f1f0ee;--muted:#9b9a98;--btn:#242427;--btn-b:#3a3a3e;--on:#f1f0ee;--on-fg:#151517;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px 16px}
#timer{width:min(88vw,62vh,440px);height:auto;touch-action:none;cursor:grab;filter:drop-shadow(0 14px 22px rgba(0,0,0,.28))}
#timer:active{cursor:grabbing}
.read{text-align:center}
#clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#status{margin-top:2px;font-size:15px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button{font:inherit;font-size:15px;padding:10px 18px;border-radius:12px;border:1px solid var(--btn-b);background:var(--btn);color:var(--fg);cursor:pointer}
button:focus-visible{outline:3px solid #e0242b;outline-offset:2px}
button.main{background:#e0242b;border-color:#e0242b;color:#fff;font-weight:700;min-width:104px}
button.chip[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.hint{font-size:13px;color:var(--muted);text-align:center;max-width:340px;line-height:1.5}
[hidden]{display:none!important}
#repRow{align-items:center;gap:12px}
#repRow button{padding:6px 16px;font-size:18px;line-height:1.2}
#repRow button:disabled{opacity:.4;cursor:default}
#repNum{font-size:22px;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.reptxt{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <svg id="timer" viewBox="0 0 400 400" role="img" aria-label="남은 시간을 빨간 원판으로 보여주는 60분 타이머">
    <rect x="4" y="4" width="392" height="392" rx="46" fill="#17171a"/>
    <rect x="24" y="30" width="352" height="340" rx="30" fill="#fbfbf9"/>
    <g id="ticks"></g>
    <g id="nums" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#161616" text-anchor="middle"></g>
    <path id="wedge" fill="#e0242b"/>
    <circle cx="200" cy="200" r="19" fill="#1b1b1d"/>
    <circle cx="200" cy="200" r="10" fill="#2f2f33"/>
    <text x="200" y="387" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#8a8a8e" text-anchor="middle">KAVET TIMER</text>
  </svg>

  <div class="read">
    <div id="clock">25:00</div>
    <div id="status">집중</div>
  </div>

  <div class="row">
    <button id="go" class="main">시작</button>
    <button id="reset">처음으로</button>
    <button id="preview">🔔 알람 미리듣기</button>
  </div>

  <div class="row" id="presets">
    <button class="chip" data-set="50:집중,10:휴식" aria-pressed="false">50+10 세트</button>
    <button class="chip" data-min="50" data-label="집중" aria-pressed="false">50분 집중</button>
    <button class="chip" data-min="10" data-label="휴식" aria-pressed="false">10분 휴식</button>
    <button class="chip" data-min="25" data-label="집중" aria-pressed="true">25분 집중</button>
    <button class="chip" data-min="5" data-label="휴식" aria-pressed="false">5분 휴식</button>
  </div>

  <div class="row" id="repRow" hidden>
    <span class="reptxt">세트 반복</span>
    <button id="repMinus" aria-label="횟수 줄이기">−</button>
    <strong id="repNum">6</strong>
    <button id="repPlus" aria-label="횟수 늘리기">+</button>
    <span class="reptxt">회</span>
  </div>

  <p class="hint">원판을 눌러 끌면 1분 단위로 시간을 직접 맞출 수 있어요. 스페이스바로 시작·정지합니다.</p>
</main>

<script>
(function () {
  var C = 200, R = 104, NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("timer"), wedge = document.getElementById("wedge");
  var clock = document.getElementById("clock"), statusEl = document.getElementById("status");
  var go = document.getElementById("go"), resetBtn = document.getElementById("reset"), repRow = document.getElementById("repRow"), repNum = document.getElementById("repNum"), repMinus = document.getElementById("repMinus"), repPlus = document.getElementById("repPlus");
  var chips = document.querySelectorAll(".chip");
  var total = 25 * 60, rem = total, running = false, endAt = 0, timer = 0, alarm = 0, label = "집중", audio = null, bellBuf = null, bellSrc = null, steps = [], setDef = null, reps = 6;

  function pt(m, r) { var a = m * 6 * Math.PI / 180; return [C - r * Math.sin(a), C - r * Math.cos(a)]; }
  function el(n, attrs, parent) {
    var e = document.createElementNS(NS, n);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  }

  // dial: ticks every minute, numbers every 5 minutes, counterclockwise from 0
  var ticks = document.getElementById("ticks"), nums = document.getElementById("nums");
  for (var i = 0; i < 60; i++) {
    var major = i % 5 === 0, a = pt(i, major ? 147 : 153), b = pt(i, 160);
    el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "#161616", "stroke-width": major ? 2.6 : 1.2, "stroke-linecap": "round" }, ticks);
    if (major) {
      var p = pt(i, 126), t = el("text", { x: p[0], y: p[1], "dominant-baseline": "central" }, nums);
      t.textContent = i;
    }
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function render() {
    var m = Math.min(60, rem / 60), d = "";
    if (m >= 59.999) {
      d = "M" + C + " " + C + "m-" + R + " 0a" + R + " " + R + " 0 1 0 " + (2 * R) + " 0a" + R + " " + R + " 0 1 0 -" + (2 * R) + " 0";
    } else if (m > 0.001) {
      var e = pt(m, R);
      d = "M" + C + " " + C + "L" + C + " " + (C - R) + "A" + R + " " + R + " 0 " + (m > 30 ? 1 : 0) + " 0 " + e[0].toFixed(2) + " " + e[1].toFixed(2) + "Z";
    }
    wedge.setAttribute("d", d);
    var s = Math.ceil(rem);
    clock.textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
    statusEl.textContent = rem <= 0 ? (alarm ? "시간이 끝났어요 · 화면을 누르면 알람이 꺼져요" : "시간이 끝났어요") : label + (setDef ? " · " + (Math.floor((setDef.length * reps - steps.length - 1) / setDef.length) + 1) + "/" + reps + "세트" : "") + (steps.length ? " · 다음 " + steps[0][1] + " " + steps[0][0] + "분" : "");
    go.textContent = running ? "일시정지" : (rem <= 0 ? "다시 시작" : "시작");
    repRow.hidden = !setDef; repNum.textContent = reps; repMinus.disabled = repPlus.disabled = running;
    document.title = (running ? clock.textContent + " · " : "") + "Kavet Timer";
  }

      setChip(c); render();
      if (wasRunning) start();
    });
  });

  // drag the dial to set minutes
  var dragging = false;
  function fromPointer(e) {
    var r = svg.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * 400 - C, y = (e.clientY - r.top) / r.height * 400 - C;
    if (Math.hypot(x, y) < 22) return;
    var a = Math.atan2(x, -y) * 180 / Math.PI; if (a < 0) a += 360;
    var m = Math.round(((360 - a) % 360) / 6), prev = Math.round(rem / 60);
    if (prev >= 45 && m <= 10) m = 60; else if (prev <= 15 && m >= 50) m = 0;
    rem = total = m * 60; label = "직접 설정"; setChip(null); setDef = null; steps = [];
    if (running) {
      if (rem <= 0) { pause(); } else endAt = Date.now() + rem * 1000;
    }
    render();
  }
  svg.addEventListener("pointerdown", function (e) { dragging = true; svg.setPointerCapture(e.pointerId); fromPointer(e); });
  svg.addEventListener("pointermove", function (e) { if (dragging) fromPointer(e); });
  svg.addEventListener("pointerup", function () { dragging = false; });
  svg.addEventListener("pointercancel", function () { dragging = false; });

  render();
})();
</script>
</body>
</html>
